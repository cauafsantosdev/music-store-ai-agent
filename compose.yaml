name: music-store-agent

services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env and set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - app

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-openai/gpt-oss-120b}
      AI_DEMO_SCHEMA: ${AI_DEMO_SCHEMA:-agent_demo}
      AI_STATE_SCHEMA: ${AI_STATE_SCHEMA:-agent_state}
      AI_MAX_MODEL_CALLS: ${AI_MAX_MODEL_CALLS:-4}
      AI_MAX_TOOL_CALLS: ${AI_MAX_TOOL_CALLS:-6}
      AI_RECURSION_LIMIT: ${AI_RECURSION_LIMIT:-24}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-2048}
      AI_PROVIDER_TIMEOUT_SECONDS: ${AI_PROVIDER_TIMEOUT_SECONDS:-30}
      AI_MAX_HISTORY_MESSAGES: ${AI_MAX_HISTORY_MESSAGES:-60}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - app

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://api:8000}
      BACKEND_TIMEOUT_SECONDS: ${BACKEND_TIMEOUT_SECONDS:-5}
      BACKEND_READ_TIMEOUT_SECONDS: ${BACKEND_READ_TIMEOUT_SECONDS:-180}
    ports:
      - "127.0.0.1:${WEB_PORT:-8501}:8501"
    volumes:
      - ./web:/app/web
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - app

volumes:
  postgres_data:

networks:
  app:
    driver: bridge
