[project]
name = "music-store-agent"
version = "0.1.0"
description = "Customer support AI agent for Empório da Música."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "langchain>=1.4.8,<2",
    "langchain-groq>=1.1.3,<2",
    "langgraph>=1.2.19,<2",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "pypdf>=6.21.4",
    "sqlalchemy>=2.0,<3.0",
    "streamlit>=1.40,<2.0",
    "uvicorn>=0.32,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10.0",
    "ruff>=0.9,<1.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/music_store_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
markers = ["live: explicitly opted-in external GroqCloud smoke test"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
